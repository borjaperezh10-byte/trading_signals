name: Señales diarias

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r engine/requirements.txt

      - name: Ejecutar el motor
        working-directory: engine
        run: python run_daily.py

      - name: Publicar resultados
        run: |
          git config user.name  "motor-swing"
          git config user.email "actions@github.com"
          git add public/data/results.json public/data/portfolio.json
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Señales de $(date -u +%Y-%m-%d)"
            git push
          fi
